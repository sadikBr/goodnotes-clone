# Builds Inkleaf for Linux (AppImage), Windows (an installer, and the same
# folder zipped) and Android (APK), checks the desktop builds start, and
# keeps them as downloadable artifacts of the run (Actions → Qt app). The
# release workflow runs this too and publishes the results.
#
# Secrets: GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (Drive sync; without
# them the app works but can't sign in) and the Android signing ones
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD; without them the APK is unsigned, and a release fails).
name: Qt app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["qt/**", "core/**", "src/**", "scripts/qt-*", "package*.json", "Cargo.*", ".github/workflows/qt.yml"]
  workflow_call:
    inputs:
      release:
        description: "Building a release: the APK must be signed."
        type: boolean
        default: false

# A newer push replaces a running build of the same branch; a release's
# build (run from the Release workflow) is never replaced by a push.
concurrency:
  group: qt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  linux:
    # The oldest supported runner: the AppImage then runs on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/qt/cargo"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtpdf
          cache: true
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libfuse2 ninja-build
      - run: npm ci
      - name: Scripts bundle (the web app's drawing code)
        run: npm run qt-bridge
      - name: Build
        env:
          INKLEAF_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          INKLEAF_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          cmake -S qt -B build/qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/qt
          DESTDIR=$PWD/AppDir cmake --install build/qt
      - name: Unit tests (Rust core, shared TypeScript)
        run: |
          cargo test -p inkleaf-core
          npm test
      - name: The C++ code's own tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/qt/inkleaf --self-test
      - name: C++ drawing matches the scripts' (docs/MIGRATION.md)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/qt/inkleaf --compare-render "$RUNNER_TEMP/compare"
      - name: Differing pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compare-render
          path: ${{ runner.temp }}/compare
      - name: AppImage
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/qt/qml
          EXTRA_QT_MODULES: svg;pdf;network
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so;libqoffscreen.so
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # Wayland's helpers aren't platform plugins, so the Qt plugin
          # leaves them out: GPU drawing (wayland-egl), the window frame and
          # the shell. linuxdeploy then bundles what they need.
          mkdir -p AppDir/usr/plugins
          for d in wayland-graphics-integration-client wayland-decoration-client wayland-shell-integration; do
            cp -r "$QT_ROOT_DIR/plugins/$d" AppDir/usr/plugins/
          done
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          version=$(node -p "require('./package.json').version")
          LINUXDEPLOY_OUTPUT_VERSION=$version ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            -d AppDir/usr/share/applications/inkleaf.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/inkleaf.png
          mv Inkleaf-*.AppImage "Inkleaf_${version}_x86_64.AppImage"
          # What a Wayland desktop needs is in it (CI can't start it there).
          for f in platforms/libqwayland-egl.so platforms/libqxcb.so wayland-graphics-integration-client/libqt-plugin-wayland-egl.so wayland-shell-integration/libxdg-shell.so; do
            test -e "AppDir/usr/plugins/$f" || { echo "missing from the AppImage: $f"; exit 1; }
          done
          ls AppDir/usr/lib | grep -q WaylandEglClientHwIntegration || { echo "missing from the AppImage: libQt6WaylandEglClientHwIntegration"; exit 1; }
      - name: The AppImage starts (window, scripts and dialogs load)
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: 1
        # Without the Qt installed here, so a module missing from the AppImage fails.
        run: env -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u QT_PLUGIN_PATH -u LD_LIBRARY_PATH INKLEAF_DATA_DIR=$RUNNER_TEMP/library ./Inkleaf_*_x86_64.AppImage --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: inkleaf-qt-linux
          path: Inkleaf_*_x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/qt/cargo"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - name: Scripts bundle (the web app's drawing code)
        run: npm run qt-bridge
      - name: Build
        env:
          INKLEAF_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          INKLEAF_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          cmake -S qt -B build/qt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/qt
      - name: Gather the app and Qt's files
        shell: bash
        run: |
          mkdir -p dist/Inkleaf
          cp build/qt/inkleaf.exe dist/Inkleaf/Inkleaf.exe
          windeployqt --release --qmldir qt/qml --no-translations --compiler-runtime dist/Inkleaf/Inkleaf.exe
          # Left out, as Inkleaf never uses them: Direct3D 12's shader
          # compiler (Qt Quick draws with Direct3D 11 on Windows) and the
          # Qt Quick Controls styles other than Basic (the app's own style,
          # InkleafStyle, builds on Basic). The software OpenGL fallback
          # (opengl32sw.dll) stays, for PCs whose graphics drivers fail.
          cd dist/Inkleaf
          rm -f dxcompiler.dll dxil.dll
          for st in Fusion Material Universal Imagine FluentWinUI3 Windows iOS macOS; do
            rm -rf "qml/QtQuick/Controls/$st"
            rm -f Qt6QuickControls2${st}.dll Qt6QuickControls2${st}StyleImpl.dll
          done
          # Nothing left needs a removed file (or the app wouldn't start somewhere).
          dumpbin //dependents $(find . -name '*.dll' -o -name '*.exe') | grep -ioE '(Qt6QuickControls2(Fusion|Material|Universal|Imagine|FluentWinUI3|Windows|IOS|MacOS)[a-z]*|dxcompiler|dxil)\.dll' | sort -u > ../removed-but-needed.txt || true
          if [ -s ../removed-but-needed.txt ]; then echo "::error::still needed:"; cat ../removed-but-needed.txt; exit 1; fi
          grep -rlE 'QtQuick\.Controls\.(Fusion|Material|Universal|Imagine|FluentWinUI3|Windows|iOS|macOS)' qml --include=qmldir | grep -v '^qml/QtQuick/Controls/qmldir$' > ../style-imports.txt || true
          if [ -s ../style-imports.txt ]; then echo "::error::modules import a removed style:"; cat ../style-imports.txt; exit 1; fi
          cd ../..
          # It starts (window, scripts and dialogs load), without the Qt
          # installed here, so a module missing from the folder fails.
          env -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u QT_PLUGIN_PATH INKLEAF_DATA_DIR="$RUNNER_TEMP/library" ./dist/Inkleaf/Inkleaf.exe --smoke
          version=$(node -p "require('./package.json').version")
          (cd dist && 7z a "../Inkleaf_${version}_windows_x64.zip" Inkleaf > /dev/null)
      - name: Installer (setup .exe)
        shell: bash
        run: |
          makensis=$(command -v makensis || true)
          [ -n "$makensis" ] || makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -x "$makensis" ]; then choco install nsis -y --no-progress > /dev/null; makensis="/c/Program Files (x86)/NSIS/makensis.exe"; fi
          version=$(node -p "require('./package.json').version")
          out="$PWD/Inkleaf_${version}_windows_x64_setup.exe"
          "$makensis" -V2 -DVERSION="$version" -DSOURCE="$(cygpath -w "$PWD/dist/Inkleaf")" -DOUTFILE="$(cygpath -w "$out")" qt/packaging/windows/inkleaf.nsi
          # It installs (quietly, into a test folder) and the installed app starts.
          dir="$(cygpath -w "$RUNNER_TEMP/installed")"
          powershell -NoProfile -Command "Start-Process -FilePath '$(cygpath -w "$out")' -ArgumentList '/S','/D=$dir' -Wait"
          test -f "$RUNNER_TEMP/installed/Inkleaf.exe" && test -f "$RUNNER_TEMP/installed/uninstall.exe"
          env -u QML_IMPORT_PATH -u QML2_IMPORT_PATH -u QT_PLUGIN_PATH INKLEAF_DATA_DIR="$RUNNER_TEMP/library2" "$RUNNER_TEMP/installed/Inkleaf.exe" --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: inkleaf-windows-setup
          path: Inkleaf_*_windows_x64_setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: inkleaf-windows-zip
          path: Inkleaf_*_windows_x64.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The NDK Qt 6.8 is built with.
      - name: Android NDK
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/android/android_build/cargo"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          extra: --autodesktop
          cache: true
      - run: npm ci
      - name: Scripts bundle (the web app's drawing code)
        run: npm run qt-bridge
      - name: Signing key (when the Android secrets are set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/inkleaf.jks"
            echo "SIGN=ON" >> "$GITHUB_ENV"
          elif [ "${{ inputs.release }}" = "true" ]; then
            echo "::error::A release needs the Android signing secrets (ANDROID_KEYSTORE_BASE64 and the others)"; exit 1
          else
            echo "SIGN=OFF" >> "$GITHUB_ENV"
          fi
      - name: Build the APK (arm64 tablets)
        env:
          INKLEAF_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          INKLEAF_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/inkleaf.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          host=$(ls -d "$QT_ROOT_DIR"/../gcc_64 | head -n 1)
          "$QT_ROOT_DIR/bin/qt-cmake" -S qt -B build/android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$host" -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$NDK_HOME" \
            -DQT_ANDROID_SIGN_APK=$SIGN
          cmake --build build/android --target apk
          version=$(node -p "require('./package.json').version")
          apk=$(find build/android -name '*.apk' | grep -v unaligned | head -n 1)
          test -n "$apk"
          cp "$apk" "Inkleaf_${version}_android_arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: inkleaf-qt-android
          path: Inkleaf_*_android_arm64.apk
