# Builds and publishes a release when a version tag is pushed:
#   python3 scripts/set-version.py 0.9.1 && git commit -am "v0.9.1" && git tag v0.9.1 && git push origin main v0.9.1
# The app looks at the latest release (Settings → Updates) and offers its download.
#
# Needs (repository Settings → Secrets and variables → Actions):
#   (Android) secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   (Drive sync) secrets GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
name: Release

on:
  push:
    tags: ["v*"]
  # Or Actions → Release → Run workflow: releases the version in VERSION
  # (GitHub creates the tag when the release is published).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Which version
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag="v$(cat VERSION)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag matches the app version
        run: python3 scripts/check-version.py
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # A draft left by an earlier, failed run is reused.
          # What's new (CHANGELOG.md): shown on the release page and in the app's update card.
          python3 scripts/release-notes.py "$TAG" > notes.md
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            echo "reusing the draft release $TAG"
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
          elif gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already published: run scripts/set-version.py with a new version first"; exit 1
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Inkleaf $TAG" --notes-file notes.md
          fi

  # Linux, Windows and Android, built and checked as on every push.
  build:
    needs: create-release
    uses: ./.github/workflows/qt.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach the downloads and publish (the app then offers the update)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          ls -l out
          for f in out/Inkleaf_*_x86_64.AppImage out/Inkleaf_*_windows_x64_setup.exe out/Inkleaf_*_windows_x64.zip out/Inkleaf_*_android_arm64.apk; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          gh release upload "$TAG" out/Inkleaf_* --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
