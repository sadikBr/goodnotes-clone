[package]
name = "inkleaf"
version = "0.8.0"
description = "Inkleaf - a handwritten note-taking desktop app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "inkleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
inkleaf-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-fs = "=2.7.1"

# Desktop only: in-app updates (signed, from GitHub Releases) and restart.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.14.0"
tauri-plugin-process = "=2.4.0"
