[package]
name = "inkleaf"
version = "0.8.0"
description = "Inkleaf - a handwritten note-taking desktop app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "inkleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
base64 = "0.22"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-fs = "=2.7.1"
# Google Drive sync (HTTPS with rustls, which the build already has).
ureq = "=2.12.1"
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Desktop only: in-app updates (signed, from GitHub Releases) and restart.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.14.0"
tauri-plugin-process = "=2.4.0"

[target.'cfg(windows)'.dependencies]
# Offline handwriting recognition (Windows Ink); same versions Tauri already uses.
windows = { version = "0.62", features = ["UI_Input_Inking", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
