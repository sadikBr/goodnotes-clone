[package]
name = "inkleaf-core"
version = "0.14.0"
description = "Inkleaf's core: the notebook database, sync, backups, exports and ink geometry, shared by the apps"
edition = "2021"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
base64 = "0.22"
# PKCE for Google sign-in.
sha2 = "0.10"
# Google Drive sync (HTTPS with rustls).
ureq = "=2.12.1"
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
# Offline handwriting recognition (Windows Ink).
windows = { version = "0.62", features = ["UI_Input_Inking", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
windows-core = "0.62"
windows-collections = "0.3"
windows-future = "0.3"
